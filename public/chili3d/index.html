<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A 3D CAD application that runs directly in your browser for online model design and editing。一款直接在浏览器中运行的3D CAD应用程序，实现在线模型设计与编辑"><meta name="keywords" content="Web CAD,WebAssembly,WASM,Three.js,OCCT,Opencascade,3D CAD,在线 CAD,在线建模"><meta name="author" content="仙阁"><title>Chili3D</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="index.css"><link href="main.css" rel="stylesheet"><link href="/chili3d-bridge/theme-override.css" rel="stylesheet"></head><body><noscript>You need to enable JavaScript to run this app.</noscript>

<script>
  // Chili3D builds these two relative URLs from a document URL that carries the
  // runtime plugin query. Normalize them without changing any other requests.
  (() => {
    const nativeFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const raw = typeof input === 'string' ? input : input.url;
      const url = new URL(raw, window.location.href);
      if (url.pathname === '/videos.json') return nativeFetch('/chili3d/videos.json', init);
      if (url.pathname === '/chili3d' && url.searchParams.get('plugin')?.endsWith('/plugins/plugins.json')) {
        return nativeFetch('/chili3d/plugins/plugins.json', init);
      }
      return nativeFetch(input, init);
    };
  })();
</script>
<script defer src="main.js"></script></body></html>
